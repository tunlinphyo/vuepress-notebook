<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="about-card">
      <section class="about-card__surface">
        <div class="about-card__content" id="cardContent">
          <h1>Tun Lin Phyo</h1>
          <p>Frontend Engineer</p>

          <div class="about-card__spacer"></div>

          <ul class="about-card__actions">
            <li>
              <button
                type="button"
                class="about-card__action"
                data-contact="github"
              >
                <span class="about-card__icon" aria-hidden="true">
                  <svg width="24" height="24" viewBox="0 0 152 152">
                    <path
                      fill="currentColor"
                      d="M53.1 141c4.6 0 5.9-1.8 5.9-4.1s0-7.3-.1-14.4c-23.9 5.1-29-11.4-29-11.4-3.9-9.7-9.6-12.4-9.6-12.4-7.8-5.2.6-5.1.6-5.1 8.6.6 13.2 8.7 13.2 8.7 7.7 13 20.1 9.2 25 7 .4-4.3 2.3-8.4 5.5-11.4-19.1-2.1-39.2-9.4-39.2-41.8-.1-8.4 3.1-16.6 8.9-22.7-1-2.1-3.9-10.7.7-22.4 0 0 7.2-2.3 23.7 8.7 14.1-3.8 28.9-3.8 43 0C118 8.8 125.3 11 125.3 11c4.6 11.6 1.7 20.2.9 22.4 5.8 6.1 8.9 14.3 8.8 22.7 0 32.5-20.1 39.6-39.3 41.7 3 2.5 5.8 7.7 5.8 15.6 0 11.4-.1 20.4-.1 23.1 0 2.2 1 4 5.9 4z"
                    ></path>
                  </svg>
                </span>
                <span>GitHub</span>
              </button>
            </li>
            <li>
              <button
                type="button"
                class="about-card__action"
                data-contact="linkedin"
              >
                <span class="about-card__icon" aria-hidden="true">
                  <svg width="24" height="24" viewBox="0 0 24 24">
                    <path
                      fill="currentColor"
                      d="M23.994 24v-.001H24v-8.802c0-4.306-.927-7.623-5.961-7.623-2.42 0-4.044 1.328-4.707 2.587h-.07V7.976H8.489v16.023h4.97v-7.934c0-2.089.396-4.109 2.983-4.109 2.549 0 2.587 2.384 2.587 4.243V24zM.396 7.977h4.976V24H.396zM2.882 0C1.291 0 0 1.291 0 2.882s1.291 2.909 2.882 2.909 2.882-1.318 2.882-2.909A2.884 2.884 0 0 0 2.882 0z"
                    ></path>
                  </svg>
                </span>
                <span>LinkedIn</span>
              </button>
            </li>
            <li>
              <button
                type="button"
                class="about-card__action"
                data-contact="email"
              >
                <span class="about-card__icon" aria-hidden="true">
                  <svg width="24" height="24" viewBox="0 0 433.664 433.664">
                    <path
                      fill="currentColor"
                      d="M229.376 271.616c-4.096 2.56-8.704 3.584-12.8 3.584s-8.704-1.024-12.8-3.584L0 147.2v165.376c0 35.328 28.672 64 64 64h305.664c35.328 0 64-28.672 64-64V147.2L229.376 271.616zM369.664 57.088H64c-30.208 0-55.808 21.504-61.952 50.176l215.04 131.072 214.528-131.072c-6.144-28.672-31.744-50.176-61.952-50.176z"
                    ></path>
                  </svg>
                </span>
                <span>Email</span>
              </button>
            </li>
          </ul>
        </div>

        <article class="about-card__panel is-hidden" id="detailPanel">
          <button
            type="button"
            class="about-card__close"
            id="closePanel"
            aria-label="Close detail"
          ></button>
          <h2 id="detailTitle"></h2>
          <p id="detailDescription"></p>
          <a id="detailLink" href="" target="_blank" rel="noreferrer"></a>
        </article>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
