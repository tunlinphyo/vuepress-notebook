<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll State</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
  rel="stylesheet"
  fetchpriority="high">
<style>
:root {
  color-scheme: light dark;

  font-family: "Google Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
  font-size: 100%;

  --padding-x: 0.5rem;
  --surface: light-dark(
    Canvas,
    color-mix(in oklab, Canvas, CanvasText 30%)
  );
}

*, *::before, *::after {
  box-sizing: border-box;
}

:where(html,body) {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background-color: Canvas;
  color: CanvasText;
}

:where(main) {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}

@supports (appearance: base-select) {
  select,
  ::picker(select) {
    appearance: base-select;
  }

  :where(select) {
    border: none;
    outline: 2px dotted hotpink;
    anchor-name: --select;

    &:focus-visible {
      outline: 2px solid ActiveText;
      outline-offset: 2px;
    }

    &::picker-icon {
      color: GrayText;
    }

    & selectedcontent {
      & span {
        display: none;
      }
    }

    & option {
      padding: 2px;
      text-align: center;
      pointer-events: none;

      container-type: scroll-state;
      scroll-snap-align: center;
      /* scroll-snap-stop: always; */

      .option-item {
        width: 100%;
        height: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', Courier, monospace;
        opacity: 0.5;
        scale: 0.8;
        background-color: Canvas;
        box-shadow: rgba(0, 0, 0, 0.05) 0px 0px 0px 1px;
      }

      &::checkmark {
        display: none;
      }

      &:checked {
        background-color: Highlight;
      }
    }
  }

  ::picker(select) {
    outline: none;
    border: none;
    background-color: Canvas;
    width: 8rem;
    gap: 0.25rem;

    position-anchor: --select;
    outline: 2px solid hotpink;

    height: 3rem;
    padding: 0.5rem 0.25rem;
    top: calc(anchor(center) - 1.5rem);
    left: calc(anchor(center) - 5rem);

    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    scroll-behavior: smooth;
    overscroll-behavior: none;

    /* transition: all 0.3s var(--ease-sine-out); */

    border-radius: 15px;
    @supports(corner-shape: squircle) {
      border-radius: 30px;
      corner-shape: squircle;
    }
  }

  select:open {
    &::picker(select) {
      height: 10rem;
      top: calc(anchor(center) - 5rem);
      padding: 4rem 0.25rem;
      overflow-y: auto;

      @starting-style {
        height: 3rem;
        top: calc(anchor(center) - 1.5rem);
        padding: 0.5rem 0.25rem;
      }
    }
  }

  :where(.person) {
    display: grid;
    grid-template-columns: 2.5rem 1fr;
    align-items: center;
    gap: 0.5rem;

    img {
      width: 2.5rem;
      aspect-ratio: 1;
      display: grid;
      border-radius: 50%;
    }

    .about {
      padding-inline-end: 0.5rem;

      & h3 {
        margin: 0;
        font-size: 1rem;
        font-weight: 400;
      }

      & span {
        font-size: 0.8rem;
        color: GrayText;
      }
    }
  }
}

@supports (container-type: scroll-state) {
  @container scroll-state(snapped: y) {
    option {
      .option-item {
        opacity: 1;
        scale: 1;
      }
    }
  }
}

:where([data-layer]) {
  *, *::before, *::after {
    outline: 1px dotted hotpink;
  }
}

:where(html) {
  --ease-sine-in: cubic-bezier(.47,0,.745,.715);
  --ease-sine-in-out: cubic-bezier(.445,.05,.55,.95);
  --ease-sine-out: cubic-bezier(.39,.575,.565,1);
}
</style>
</head>
<body>
<main>
  <select>
    <option value="2026"><div class="option-item">2026</div></option>
    <option value="2025"><div class="option-item">2025</div></option>
    <option value="2024"><div class="option-item">2024</div></option>
    <option value="2023"><div class="option-item">2023</div></option>
    <option value="2022"><div class="option-item">2022</div></option>
    <option value="2021"><div class="option-item">2021</div></option>
    <option value="2020"><div class="option-item">2020</div></option>
    <option value="2019"><div class="option-item">2019</div></option>
    <option value="2018"><div class="option-item">2018</div></option>
    <option value="2017"><div class="option-item">2017</div></option>
    <option value="2016"><div class="option-item">2016</div></option>
    <option value="2015"><div class="option-item">2015</div></option>
    <option value="2014"><div class="option-item">2014</div></option>
    <option value="2013"><div class="option-item">2013</div></option>
    <option value="2012"><div class="option-item">2012</div></option>
    <option value="2011"><div class="option-item">2011</div></option>
    <option value="2010"><div class="option-item">2010</div></option>
    <option value="2009"><div class="option-item">2009</div></option>
    <option value="2008"><div class="option-item">2008</div></option>
    <option value="2007"><div class="option-item">2007</div></option>
    <option value="2006"><div class="option-item">2006</div></option>
    <option value="2005"><div class="option-item">2005</div></option>
    <option value="2004"><div class="option-item">2004</div></option>
    <option value="2003"><div class="option-item">2003</div></option>
    <option value="2002"><div class="option-item">2002</div></option>
    <option value="2001"><div class="option-item">2001</div></option>
    <option value="2000"><div class="option-item">2000</div></option>
    <option value="1999"><div class="option-item">1999</div></option>
    <option value="1998"><div class="option-item">1998</div></option>
    <option value="1997"><div class="option-item">1997</div></option>
    <option value="1996"><div class="option-item">1996</div></option>
    <option value="1995"><div class="option-item">1995</div></option>
    <option value="1994"><div class="option-item">1994</div></option>
    <option value="1993"><div class="option-item">1993</div></option>
    <option value="1992"><div class="option-item">1992</div></option>
    <option value="1991"><div class="option-item">1991</div></option>
    <option value="1990"><div class="option-item">1990</div></option>
  </select>
</main>
<script>
const select = document.querySelector("select");

// The "Selection Zone" logic
const observerOptions = {
  // Look for intersections relative to the picker's viewport
  // We use a rootMargin to narrow the search area to the middle 10%
  rootMargin: '-45% 0px -45% 0px',
  threshold: 1
};

const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    // Only update the value if the picker is actually open
    // and the item is centered (intersecting)
    if (entry.isIntersecting && select.matches(":open")) {
      const newValue = entry.target.value;
      if (select.value !== newValue) {
        select.value = newValue;
        // Optional: Trigger a change event for form listeners
        select.dispatchEvent(new Event('change'));
      }
    }
  });
}, observerOptions);

// Start watching all options
select.querySelectorAll('option').forEach(option => {
  observer.observe(option);
});
</script>
</body>
</html>
