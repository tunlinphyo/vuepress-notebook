<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll State</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,200..700;1,17..18,200..700&display=swap"
  rel="stylesheet"
  fetchpriority="high">
<style>
:root {
  color-scheme: light dark;

  font-family: "Google Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
  font-size: 100%;

  --padding-x: 0.5rem;
  --surface: light-dark(
    color-mix(in oklab, Canvas, CanvasText 10%),
    color-mix(in oklab, Canvas, CanvasText 25%)
  );
}

* {
  box-sizing: border-box;
}

:where(html,body) {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background-color: light-dark(var(--surface), Canvas);
  color: CanvasText;
}

:where(h1,p,button) {
  all: unset;
}

:where(main) {
  width: 100%;
  height: 100%;
  display: grid;
  justify-content: center;
  align-items: center;
}

:where(section) {
  padding: 1rem;

  & h1 {
    font-weight: 200;
    display: block;
    font-size: clamp(1.5rem, 8vw, 3rem);
  }

  & p {
    display: block;
    font-size: 0.9rem;
    max-width: 22rem;
  }
}

:where([data-layer]) {
  *, *::before, *::after {
    outline: 1px dotted hotpink;
  }
}
</style>
</head>
<body>
<main>
  <section>
    <h1>Frontend Developer</h1>
    <p>focused on design systems, accessibility, and modern web technologies.</p>
  </section>
</main>
</body>
</html>
